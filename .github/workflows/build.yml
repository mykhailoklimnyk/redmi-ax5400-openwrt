name: Build firmware

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which image to build (both = next and official)
        type: choice
        options: [both, nss, next, official]
        default: next
      mode:
        description: full = build and check the image; configure-only = stop after the configuration checks
        type: choice
        options: [full, configure-only]
        default: full
      publish:
        description: Publish the checked image as a pre-release (candidate)
        type: boolean
        default: true
  schedule:
    - cron: "17 3 1 * *" # monthly

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON((github.event_name == 'schedule' || inputs.variant == 'both') && '["next","official"]' || format('["{0}"]', inputs.variant)) }}
    env:
      VARIANT: ${{ matrix.variant }}
      MODE: ${{ github.event_name == 'schedule' && 'full' || inputs.mode }}
      PUBLISH: ${{ github.event_name == 'schedule' && 'true' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential clang llvm flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev libelf-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget zstd ccache

      - name: Version
        run: echo "VERSION=${VARIANT}-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Restore downloaded sources
        uses: actions/cache@v4
        with:
          path: src/dl
          key: dl-${{ matrix.variant }}-${{ hashFiles('sources.env') }}-${{ github.run_number }}
          restore-keys: |
            dl-${{ matrix.variant }}-${{ hashFiles('sources.env') }}-
            dl-${{ matrix.variant }}-

      - name: Prepare sources and configuration
        run: scripts/prepare.sh "$VARIANT" "$VERSION"

      - name: Build
        if: env.MODE == 'full'
        run: scripts/build.sh

      - name: Check the image
        if: env.MODE == 'full'
        run: scripts/verify.sh

      - name: Sign
        if: env.MODE == 'full'
        env:
          USIGN_SECRET_KEY: ${{ secrets.USIGN_SECRET_KEY }}
        run: |
          if [ -z "$USIGN_SECRET_KEY" ]; then
            echo "::warning::USIGN_SECRET_KEY is not set: the release is not signed and routers will refuse it"
            exit 0
          fi
          umask 077
          printf '%s\n' "$USIGN_SECRET_KEY" > "$RUNNER_TEMP/usign.sec"
          src/staging_dir/host/bin/usign -S -m out/SHA256SUMS -s "$RUNNER_TEMP/usign.sec" -x out/SHA256SUMS.sig
          rm -f "$RUNNER_TEMP/usign.sec"
          src/staging_dir/host/bin/usign -V -m out/SHA256SUMS -p files/etc/ax5400-ota/pubkey -x out/SHA256SUMS.sig
          echo "signed and verified against the public key shipped in the image"

      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.variant }}
          path: |
            logs/
            build-info.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Keep the image as a run artifact
        if: env.MODE == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.variant }}
          path: out/
          retention-days: 14

      - name: Publish candidate release
        if: env.MODE == 'full' && env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./build-info.txt
          {
            echo "Candidate build of the **$variant** image for the Redmi AX5400 (RA74)."
            echo
            echo "**Not yet run on real hardware.** It becomes a normal (stable) release only after it has run on a router for several days. Read the README before flashing: this router has no second firmware slot."
            echo
            echo "- source commit: \`$source_commit\`"
            echo "- kernel series: $kernel_series"
            echo "- built by run [$GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from \`$GITHUB_SHA\`"
            echo
            echo '```'
            cat out/checks.txt
            echo '```'
          } > notes.md
          # No --target: a tag on a commit older than the branch head whose workflow files
          # differ is refused for the workflow token (HTTP 403). The notes name the exact commit.
          gh release create "$VERSION" out/* --prerelease --title "$VERSION" --notes-file notes.md
